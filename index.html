<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MietStart - Deininger Umzugs- & Kautionsrechner</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            color: var(--primary);
            margin: 0 0 8px 0;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .checkbox-group input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }

        .checkbox-group label {
            margin-bottom: 0;
            font-weight: normal;
        }

        .result-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .result-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .result-amount {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .breakdown {
            text-align: left;
            font-size: 13px;
            border-top: 1px solid #bfdbfe;
            padding-top: 12px;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .btn-pay {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.2s;
        }

        .btn-pay:hover {
            background-color: #059669;
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MietStart DE</h1>
        <p>Berechne deine echten Umzugskosten in Deutschland</p>
    </div>

    <div class="card">
        <h3>1. Mietdaten</h3>
        <div class="form-group">
            <label for="kaltmiete">Nettokaltmiete (€)</label>
            <input type="number" id="kaltmiete" placeholder="z.B. 750" oninput="calculate()">
        </div>
        <div class="form-group">
            <label for="nebenkosten">Nebenkosten geschätzt (€)</label>
            <input type="number" id="nebenkosten" placeholder="z.B. 200" oninput="calculate()">
        </div>
    </div>

    <div class="card">
        <h3>2. Typische Umzugskosten</h3>
        <div class="checkbox-group">
            <input type="checkbox" id="kaution" checked onchange="calculate()">
            <label for="kaution">Mietkaution (3 Kaltmieten)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="transporter" onchange="calculate()">
            <label for="transporter">Miettransporter / Sprinter (~120 €)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="halteverbot" onchange="calculate()">
            <label for="halteverbot">Halteverbotszone (~80 €)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="post" onchange="calculate()">
            <label for="post">Nachsendeservice Deutsche Post (~35 €)</label>
        </div>
        <div class="form-group" style="margin-top: 10px;">
            <label for="kueche">Ablösevereinbarung / Küche (€)</label>
            <input type="number" id="kueche" placeholder="z.B. 500" oninput="calculate()">
        </div>
    </div>

   <div class="result-box">
        <div class="result-title">Benötigtes Startkapital</div>
        <div class="result-amount" id="totalAmount">0,00 €</div>
        
        <div class="breakdown" id="breakdownList">
            <!-- Se llena dinámicamente -->
        </div>

        <a href="https://mietstart.gumroad.com/l/spvaw" target="_blank" rel="noopener noreferrer" style="text-decoration: none;">
            <button class="btn-pay">
                📄 MietStart-Dossier jetzt sichern (2,99 €)
            </button>
        </a>
    </div>

   <!-- Ventanita Flotante Modal (Impressum / Datenschutz) -->
    <div id="legalModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:#fff; padding:25px; border-radius:12px; max-width:500px; width:90%; max-height:80vh; overflow-y:auto; font-family:sans-serif; font-size:14px; line-height:1.5; color:#333; position:relative;">
            <button onclick="document.getElementById('legalModal').style.display='none'" style="position:absolute; top:12px; right:15px; border:none; background:none; font-size:20px; cursor:pointer; color:#888;">&times;</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Pie de página con enlaces legales -->
    <footer>
        <p>&copy; 2026 MietStart DE · 
            <a href="javascript:void(0)" onclick="showLegal('impressum')" style="color:inherit; text-decoration:underline; cursor:pointer;">Impressum</a> · 
            <a href="javascript:void(0)" onclick="showLegal('datenschutz')" style="color:inherit; text-decoration:underline; cursor:pointer;">Datenschutz</a>
        </p>
    </footer>

    <script>
        function showLegal(type) {
            const modal = document.getElementById('legalModal');
            const content = document.getElementById('modalContent');
            
            if (type === 'impressum') {
                content.innerHTML = `
                    <h2 style="margin-top:0;">Impressum</h2>
                    <p><strong>Angaben gemäß § 5 DDG:</strong></p>
                    <p><strong>MietStart</strong><br>
                    Mercedes Herrera<br>
                    Grasriete 18<br>
                    49824 Emlichheim<br>
                    Deutschland</p>
                    <p><strong>Kontakt:</strong><br>
                    E-Mail: mietstartapp@gmail.com</p>
                    <p><strong>EU-Streitschlichtung:</strong><br>
                    Die Europäische Kommission stellt eine Plattform zur Online-Streitbeilegung (OS) bereit: 
                    <a href="https://ec.europa.eu/consumers/odr" target="_blank" rel="noopener">https://ec.europa.eu/consumers/odr</a>.</p>
                `;
            } else if (type === 'datenschutz') {
                content.innerHTML = `
                    <h2 style="margin-top:0;">Datenschutzerklärung</h2>
                    <p><strong>1. Datenschutz auf einen Blick</strong><br>
                    Wir nehmen den Schutz Ihrer persönlichen Daten sehr ernst. Diese Anwendung erfasst oder speichert keine personenbezogenen Daten direkt in eigenen Datenbanken. Alle Berechnungen erfolgen lokal auf Ihrem Gerät.</p>
                    <p><strong>2. Hosting (Vercel)</strong><br>
                    Diese Webseite wird bei Vercel Inc. gehostet. Beim Aufruf der Seite werden technische Daten (z. B. IP-Adresse, Server-Logfiles) automatisch erfasst.</p>
                    <p><strong>3. Zahlungsabwicklung (Gumroad)</strong><br>
                    Wenn Sie auf den Button zum Kauf des Dossiers klicken, werden Sie zu Gumroad Inc. weitergeleitet. Gumroad verarbeitet Ihre Daten (z. B. E-Mail, Zahlungsdaten) zur Kaufabwicklung und Zusendung des PDF-Dossiers. Es gelten die Datenschutzbestimmungen von Gumroad.</p>
                    <p><strong>4. Ihre Rechte</strong><br>
                    Sie haben das Recht auf Auskunft, Berichtigung oder Löschung Ihrer Daten. Kontaktieren Sie uns dazu unter: mietstartapp@gmail.com</p>
                `;
            }
            modal.style.display = 'flex';
        }
    </script>
</div>

<script>
    function calculate() {
        const kaltmiete = parseFloat(document.getElementById('kaltmiete').value) || 0;
        const nebenkosten = parseFloat(document.getElementById('nebenkosten').value) || 0;
        const kueche = parseFloat(document.getElementById('kueche').value) || 0;

        const includeKaution = document.getElementById('kaution').checked;
        const includeTransporter = document.getElementById('transporter').checked;
        const includeHalteverbot = document.getElementById('halteverbot').checked;
        const includePost = document.getElementById('post').checked;

        let kautionVal = includeKaution ? (kaltmiete * 3) : 0;
        let transporterVal = includeTransporter ? 120 : 0;
        let halteverbotVal = includeHalteverbot ? 80 : 0;
        let postVal = includePost ? 35 : 0;

        let total = kaltmiete + nebenkosten + kautionVal + transporterVal + halteverbotVal + postVal + kueche;

        document.getElementById('totalAmount').innerText = total.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });

        let breakdownHTML = `
            <div class="breakdown-item"><span>Erste Monatsmiete:</span> <strong>${(kaltmiete + nebenkosten).toFixed(2)} €</strong></div>
            <div class="breakdown-item"><span>Mietkaution:</span> <strong>${kautionVal.toFixed(2)} €</strong></div>
            <div class="breakdown-item"><span>Extras & Logistik:</span> <strong>${(transporterVal + halteverbotVal + postVal + kueche).toFixed(2)} €</strong></div>
        `;
        document.getElementById('breakdownList').innerHTML = breakdownHTML;
    }
</script>

</body>
</html>
